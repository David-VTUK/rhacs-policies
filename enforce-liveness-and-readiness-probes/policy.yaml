apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: enforce-liveness-and-readiness-probes
  namespace: rhacs-operator
spec:
  policyName: Enforce the use of Liveness and Readiness probes
  description: Requires all containers in a deployment to define both Liveness and Readiness probes.
  rationale: Missing probes prevent Kubernetes from accurately monitoring application health, leading to potential downtime and inability to automatically recover broken containers or verify service readiness.
  remediation: Configure a livenessProbe and a readinessProbe for all containers within the deployment specification. The attributes for checking liveness and readiness probes are Boolean fields.
  severity: HIGH_SEVERITY
  categories:
    - Security Best Practices
    - Configuration Management
  lifecycleStages:
    - DEPLOY
  scope:
    - namespace: rhacs-test-policies
  enforcementActions:
    - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
    - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT
    - SCALE_TO_ZERO_ENFORCEMENT
    - UNSATISFIABLE_NODE_CONSTRAINT_ENFORCEMENT
  policySections:
    - sectionName: Rule 1
      policyGroups:
        - fieldName: Liveness Probe Defined
          booleanOperator: OR
          values:
            - value: "false"
        - fieldName: Readiness Probe Defined
          booleanOperator: OR
          values:
            - value: "false"